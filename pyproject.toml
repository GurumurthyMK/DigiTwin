[project]
name = "digitwin-backend"
version = "0.1.0"
description = "DigiTwin backend — Phase 1A foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.1,<4.3",
  "email-validator>=2.0",
  "psycopg[binary]>=3.1",
  "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.11"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Depends-in-defaults is the framework's documented idiom.
ignore = ["B008"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
